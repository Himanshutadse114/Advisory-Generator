name: Verify Advisory Generator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/geminiProvider.js
          node --check server/replicateProvider.js
          node --check server/referenceSelector.js
          node --check server/visualPromptBuilder.js
          node --check server/layoutBlueprint.js
          node --check server/hybridArtworkPrompt.js
          node --check server/advisoryPrompt.js
          node --check server/secretStore.js
          node --check server/adminAuth.js

      - name: Verify phase logic
        run: npm run verify:logic

      - name: Verify admin secret security
        run: npm run verify:admin

      - name: Build frontend
        run: npm run build
