name: Verify Advisory Generator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/geminiProvider.js
          node --check server/advisoryPrompt.js

      - name: Build frontend
        run: npm run build
